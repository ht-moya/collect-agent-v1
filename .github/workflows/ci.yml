name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0
        env:
          MYSQL_ROOT_PASSWORD: test-root
          MYSQL_DATABASE: collect_agent_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: test-root
      MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/collect_agent_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      AGENT_LLM_ENABLED: "false"
      EMBEDDING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: ./mvnw test -q
