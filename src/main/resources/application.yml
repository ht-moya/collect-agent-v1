# Web 服务配置。
server:
  # 本地服务端口。
  port: ${SERVER_PORT:8080}

# Spring 基础配置。
spring:
  # 应用名称。
  application:
    # 当前应用名。
    name: collect-agent-v1
  # 可选读取项目根目录下未跟踪的本地配置。
  config:
    import: optional:file:.env.local[.properties]
  # MySQL 数据源配置。
  datasource:
    # MySQL 连接地址；数据库不存在时先执行 db/mysql/V1__schema.sql。
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/collect_agent?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    # MySQL 8/9 驱动同时兼容 MySQL 9.0。
    driver-class-name: com.mysql.cj.jdbc.Driver
    # MySQL 用户名，建议通过环境变量覆盖。
    username: ${MYSQL_USERNAME:root}
    # MySQL 密码，不在源码中保存。
    password: ${MYSQL_PASSWORD:}
  # JPA 配置。
  jpa:
    # Hibernate 配置。
    hibernate:
      # 本地首次启动可使用 update；正式环境建议改为 validate 并用迁移脚本管理 DDL。
      ddl-auto: ${JPA_DDL_AUTO:update}
    # 关闭 Open Session In View。
    open-in-view: false
    # 本地默认不输出 SQL。
    show-sql: false
    # Hibernate 额外属性。
    properties:
      hibernate:
        # 统一使用东八区时间。
        jdbc:
          time_zone: Asia/Shanghai
  # Jackson 时区配置。
  jackson:
    # 默认时区。
    time-zone: Asia/Shanghai

# Agent 配置。
agent:
  # DeepSeek 模型配置。
  llm:
    # 是否启用 DeepSeek Planner；关闭时使用规则 Planner。
    enabled: ${AGENT_LLM_ENABLED:true}
    # DeepSeek OpenAI 兼容接口。
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # DeepSeek API Key，只通过环境变量注入。
    api-key: ${DEEPSEEK_API_KEY:}
    # 聊天模型。
    chat-model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
    # 模型温度。
    temperature: 0.2
    # 请求超时秒数。
    timeout-seconds: 30
  # 会话生命周期配置。
  session:
    # 是否自动关闭超时会话。
    auto-close-enabled: ${AGENT_SESSION_AUTO_CLOSE_ENABLED:true}
    # 30分钟无状态更新后关闭。
    timeout-minutes: ${AGENT_SESSION_TIMEOUT_MINUTES:30}
    # 每分钟扫描一次超时会话。
    scan-interval-ms: ${AGENT_SESSION_SCAN_INTERVAL_MS:60000}
  # Embedding 模型配置。
  embedding:
    # 是否启用向量化。
    enabled: ${EMBEDDING_ENABLED:false}
    # 提供方。
    provider: ${EMBEDDING_PROVIDER:dashscope}
    # OpenAI 兼容地址。
    base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    # API Key，只从本地文件或环境变量读取。
    api-key: ${DASHSCOPE_API_KEY:}
    # Embedding 模型。
    model: ${EMBEDDING_MODEL:text-embedding-v4}
    # 向量维度，与 MySQL VECTOR(1024) 保持一致。
    dimension: ${EMBEDDING_DIMENSION:1024}
    # 请求超时秒数。
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:30}
    # 单批文本数量。
    batch-size: ${EMBEDDING_BATCH_SIZE:10}
  # 长期记忆配置。
  ltm:
    # 每 10 个完整对话轮次抽取一次。
    extraction-turn-interval: ${LTM_EXTRACTION_TURN_INTERVAL:10}
    # 稠密召回 TopK。
    dense-top-k: 20
    # 关键词召回 TopK。
    keyword-top-k: 20
    # 最终注入 TopK。
    final-top-k: 5
    # RRF 平滑常数。
    rrf-k: 60
    # 活跃记忆最低置信度。
    active-confidence: 0.7
    # pending 最低置信度。
    pending-confidence: 0.5
    # 时间衰减半衰期。
    recency-half-life-days: 90  # 短期记忆配置。
  stm:
    # 最近事件保留数量。
    recent-event-limit: 20
    # 发送给模型的历史对话轮次上限，摘要覆盖位点之前不会再通过原文发送。
    history-turn-limit: ${STM_HISTORY_TURN_LIMIT:6}
    # 热缓存过期分钟数。
    cache-ttl-minutes: 30
    # 规则回退摘要最大字符数。
    summary-max-chars: 500
    # 轮次结束时，未摘要事件达到该数量后触发结构化压缩。
    summary-trigger-event-count: 12
    # 压缩时保留的最近未摘要事件数量。
    summary-keep-recent-event-count: 6
    # 轮次结束时，未摘要事件估算 Token 达到该值后触发压缩。
    summary-trigger-token-estimate: 4000
    # 主 Planner 调用前的上下文 Token 预算。
    context-budget-token-estimate: 6000
    # 上下文估算时每个 Token 对应的字符数。
    context-chars-per-token: 2
    # 结构化摘要提示词版本。
    summary-prompt-version: v1
  # Outbox 配置。
  outbox:
    # Relay 扫描间隔毫秒数。
    relay-interval-ms: 2000
    # 单批处理数量。
    batch-size: 50
    # 最大重试次数。
    max-retry-count: 5

# 日志配置。
logging:
  # 日志级别。
  level:
    # 根日志只输出警告和错误。
    root: WARN
    # 大模型交互日志器输出 INFO。
    LLM_INTERACTION: INFO




