<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动态变量管理</title>
<style>
body{margin:0;background:#f5f7fb;color:#1f2937;font-family:"Microsoft YaHei",Arial,sans-serif}main{max-width:1100px;margin:30px auto;padding:0 18px 40px}h1{color:#17365d}h2{color:#17365d;font-size:18px}.sub{color:#667085}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #d9e1ec;border-radius:12px;padding:18px;margin-bottom:18px}.wide{grid-column:1/-1}label{display:block;margin:10px 0 6px;color:#667085;font-size:14px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:10px;font:inherit}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;gap:20px;margin-top:12px}.checks input{width:auto}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:9px 14px;background:#17365d;color:#fff;cursor:pointer;font:inherit}.secondary{background:#e8eef7;color:#17365d}.danger{background:#b42318}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid #e5e7eb;padding:9px 8px;text-align:left;vertical-align:top}th{color:#475467;background:#f8fafc}.status{color:#667085;min-height:22px;margin-top:10px}.pill{padding:2px 7px;border-radius:999px;background:#e8eef7;color:#17365d}a{color:#17365d}@media(max-width:850px){.layout{grid-template-columns:1fr}.wide{grid-column:auto}.row{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>动态变量管理</h1>
<p class="sub">定义变量、配置强制 tool_choice，并查看写入 MySQL 的会话变量值。</p>
<p><a href="/">返回聊天页面</a> | <a href="/debug.html">查看 MySQL 数据表</a></p>
<div class="layout">
<section class="card"><h2>工具配置</h2><label>工具描述</label><textarea id="toolDescription"></textarea><div class="checks"><label><input id="forceCall" type="checkbox">强制调用</label><label><input id="toolEnabled" type="checkbox">启用抽取</label></div><div class="actions"><button id="saveToolConfig">保存工具配置</button></div><div id="toolStatus" class="status"></div></section>
<section class="card"><h2>新增 / 编辑变量</h2><input id="editingId" type="hidden"><div class="row"><div><label>变量键</label><input id="variableKey" placeholder="address"></div><div><label>展示名称</label><input id="displayName" placeholder="住址"></div></div><label>变量说明</label><textarea id="description"></textarea><label>抽取提示</label><textarea id="extractionHint"></textarea><div class="row"><div><label>排序</label><input id="sortOrder" type="number" value="0"></div><div class="checks"><label><input id="variableEnabled" type="checkbox" checked>启用变量</label></div></div><div class="actions"><button id="saveDefinition">保存变量</button><button id="resetDefinition" class="secondary">清空</button></div><div id="definitionStatus" class="status"></div></section>
<section class="card wide"><h2>变量定义</h2><table><thead><tr><th>变量键</th><th>名称</th><th>说明</th><th>提示</th><th>状态</th><th>操作</th></tr></thead><tbody id="definitionRows"></tbody></table><div id="definitionListStatus" class="status"></div></section>
<section class="card wide"><h2>会话变量值</h2><label>会话编号</label><div class="row"><input id="valueSessionId" placeholder="例如 S10001"><div class="actions" style="margin-top:0"><button id="loadValues" class="secondary">查询变量值</button></div></div><table style="margin-top:14px"><thead><tr><th>变量键</th><th>变量值</th><th>客户</th><th>来源事件</th><th>更新时间</th></tr></thead><tbody id="valueRows"></tbody></table><div id="valueStatus" class="status"></div></section>
</div></main>
<script>
let definitions=[];
async function api(url,options={}){const response=await fetch(url,options);const text=await response.text();const data=text?JSON.parse(text):null;if(!response.ok)throw new Error(data&&data.message?data.message:response.status+" "+response.statusText);return data;}
function renderDefinitions(){document.getElementById("definitionRows").innerHTML=definitions.map((item,index)=>`<tr><td>${escapeHtml(item.variableKey)}</td><td>${escapeHtml(item.displayName)}</td><td>${escapeHtml(item.description)}</td><td>${escapeHtml(item.extractionHint||"")}</td><td><span class="pill">${item.enabled?"启用":"停用"}</span></td><td><button class="secondary" onclick="editDefinition(${index})">编辑</button> <button class="danger" onclick="removeDefinition(${item.id})">删除</button></td></tr>`).join("");}
async function loadToolConfig(){const data=await api("/api/dynamic-variables/tool-config");document.getElementById("toolDescription").value=data.description||"";document.getElementById("forceCall").checked=data.forceCall;document.getElementById("toolEnabled").checked=data.enabled;}
async function loadDefinitions(){definitions=await api("/api/dynamic-variables/definitions");renderDefinitions();}
async function saveToolConfig(){const status=document.getElementById("toolStatus");status.textContent="保存中……";try{await api("/api/dynamic-variables/tool-config",{method:"PUT",headers:{"Content-Type":"application/json; charset=UTF-8"},body:JSON.stringify({description:document.getElementById("toolDescription").value,forceCall:document.getElementById("forceCall").checked,enabled:document.getElementById("toolEnabled").checked})});status.textContent="工具配置已保存";await loadToolConfig();}catch(error){status.textContent="保存失败："+error.message;}}
function resetForm(){document.getElementById("editingId").value="";for(const id of ["variableKey","displayName","description","extractionHint"])document.getElementById(id).value="";document.getElementById("sortOrder").value="0";document.getElementById("variableEnabled").checked=true;document.getElementById("definitionStatus").textContent="";}
function editDefinition(index){const item=definitions[index];document.getElementById("editingId").value=item.id;document.getElementById("variableKey").value=item.variableKey;document.getElementById("displayName").value=item.displayName;document.getElementById("description").value=item.description;document.getElementById("extractionHint").value=item.extractionHint||"";document.getElementById("sortOrder").value=item.sortOrder;document.getElementById("variableEnabled").checked=item.enabled;window.scrollTo({top:0,behavior:"smooth"});}
async function saveDefinition(){const status=document.getElementById("definitionStatus");const id=document.getElementById("editingId").value;const body={variableKey:document.getElementById("variableKey").value.trim(),displayName:document.getElementById("displayName").value.trim(),description:document.getElementById("description").value.trim(),extractionHint:document.getElementById("extractionHint").value.trim(),sortOrder:Number(document.getElementById("sortOrder").value||0),enabled:document.getElementById("variableEnabled").checked};status.textContent="保存中……";try{await api(id?"/api/dynamic-variables/definitions/"+id:"/api/dynamic-variables/definitions",{method:id?"PUT":"POST",headers:{"Content-Type":"application/json; charset=UTF-8"},body:JSON.stringify(body)});status.textContent=id?"变量已更新":"变量已创建";resetForm();await loadDefinitions();}catch(error){status.textContent="保存失败："+error.message;}}
async function removeDefinition(id){if(!confirm("确认删除这个动态变量定义？"))return;try{await api("/api/dynamic-variables/definitions/"+id,{method:"DELETE"});await loadDefinitions();document.getElementById("definitionListStatus").textContent="变量已删除";}catch(error){document.getElementById("definitionListStatus").textContent="删除失败："+error.message;}}
async function loadValues(){const sessionId=document.getElementById("valueSessionId").value.trim();const status=document.getElementById("valueStatus");if(!sessionId){status.textContent="请输入会话编号";return;}status.textContent="查询中……";try{const values=await api("/api/dynamic-variables/values?sessionId="+encodeURIComponent(sessionId));document.getElementById("valueRows").innerHTML=values.map(item=>`<tr><td>${escapeHtml(item.variableKey)}</td><td>${escapeHtml(item.variableValue)}</td><td>${escapeHtml(item.customerId)}</td><td>${escapeHtml(String(item.sourceEventId||""))}</td><td>${escapeHtml(item.updatedAt||"")}</td></tr>`).join("");status.textContent=values.length?"":"该会话还没有动态变量值";}catch(error){status.textContent="查询失败："+error.message;}}
function escapeHtml(value){return String(value==null?"":value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
document.getElementById("saveToolConfig").addEventListener("click",saveToolConfig);document.getElementById("saveDefinition").addEventListener("click",saveDefinition);document.getElementById("resetDefinition").addEventListener("click",resetForm);document.getElementById("loadValues").addEventListener("click",loadValues);
Promise.all([loadToolConfig(),loadDefinitions()]).catch(error=>{document.getElementById("definitionListStatus").textContent="初始化失败："+error.message;});
</script>
</body></html>
